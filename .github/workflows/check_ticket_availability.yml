name: Ticket availability check

on:
  schedule:
    - cron: "26,52 7-22 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - event_id: FIGARO
            EVENT_NAME: "Nozze di Figaro"
            URL: ${{ vars.URL_FIGARO }}
            TARGET_DATE: ${{ vars.TARGET_DATE_FIGARO }}
            EMAIL_SENT: ${{ vars.EMAIL_SENT_FIGARO }}

          - event_id: SDG
            EVENT_NAME: "Sanguijuelas del Guadiana"
            URL: ${{ vars.URL_SDG }}
            TARGET_DATE: ${{ vars.TARGET_DATE_SDG }}
            EMAIL_SENT: ${{ vars.EMAIL_SENT_SDG }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - id: run_ticket_check
        name: Run ticket check
        env:
          EVENT_ID: ${{ matrix.event_id }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets[format('EMAIL_TO_{0}', matrix.event_id)] }}
          URL: ${{ matrix.URL }}
          TARGET_DATE: ${{ matrix.TARGET_DATE }}
        run: |
          python main.py > output.log
          tickets_found=$(grep 'tickets_found=' output.log | cut -d'=' -f2)
          echo "tickets_found=$tickets_found" >> $GITHUB_OUTPUT

      - name: Mark email as sent
        if: ${{ steps.run_ticket_check.outputs.tickets_found == 'true' }}
        run: |
          echo "EMAIL_SENT already managed externally or via Python logic"